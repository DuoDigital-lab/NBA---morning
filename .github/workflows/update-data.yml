name: Aktualizácia dát

on:
  schedule:
    # Ráno 2 behy (UTC): zima 06:13 a 07:13, leto 07:13 a 08:13 bratislavského času. Druhý beh doplní neskoré zápasy
    # a poistí meškanie GitHub cronu. Nepárna minúta = menej preťažený GitHub plánovač.
    - cron: "13 5 * * *"
    - cron: "13 6 * * *"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Pregenerovať všetky dni od dátumu (YYYY-MM-DD). Prázdne = bežný beh."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Závislosti (len Claude SDK, zvyšok je štandardná knižnica)
        run: pip install anthropic

      - name: Testy (vrátane kontroly spoilerov)
        run: python -m unittest discover -s tests -t . -v

      - name: Kontrola Claude kľúča (hodnota sa nevypisuje)
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then echo "ANTHROPIC_API_KEY je nastavený."
          else echo "::warning::Secret ANTHROPIC_API_KEY nie je nastavený (Settings → Secrets and variables → Actions → Repository secrets)."; fi

      - name: Generovanie dát
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5-5' }}
          CLAUDE_EFFORT: ${{ vars.CLAUDE_EFFORT || 'medium' }}
          BACKFILL_FROM: ${{ github.event.inputs.backfill_from }}
        # Pri zlyhaní ESPN skript zapíše chybu do status.json a ponechá poslednú platnú verziu dát.
        run: |
          if [ -n "$BACKFILL_FROM" ]; then
            python -m generator.build --backfill-from "$BACKFILL_FROM" || echo "::warning::Generovanie hlásilo chyby – pozri docs/data/status.json"
          else
            python -m generator.build || echo "::warning::Generovanie hlásilo chyby – pozri docs/data/status.json"
          fi

      - name: Kontrola spoilerov vo výstupe
        run: python -m unittest tests.test_no_spoilers.StaticFrontendTest -v

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then
            echo "Žiadne zmeny."
          else
            git commit -m "Aktualizácia dát $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
